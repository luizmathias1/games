<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Brasa Arena</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <div id="app"></div>

    <div id="overlay">
      <div class="panel">
        <h1>Brasa Arena</h1>
        <p>Modo teste local (etapa 1). Clique para capturar o mouse.</p>
        <label class="row">
          Sensibilidade
          <input id="sens" type="range" min="1" max="10" step="0.5" value="6" />
        </label>
        <button id="start-btn" type="button">Jogar</button>
        <p class="hint">WASD mover · Espaço pular · Ctrl agachar · Shift correr · Esc sair do mouse</p>
      </div>
    </div>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
